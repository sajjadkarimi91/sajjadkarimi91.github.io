---
layout: default
---

{% include base_path %}

<link rel="stylesheet" href="{{ base_path }}/assets/projects/projects.css">
<link rel="stylesheet" href="{{ base_path }}/assets/projects/{{ page.slug }}/css/app.css">

<div id="main" role="main">
  <div class="project-app">
    <header class="project-app__head">
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="project-app__subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>

    <div class="project-app__content">
      {{ content }}
    </div>
  </div>
</div>

{% if page.app_script %}
  <script type="module" src="{{ base_path }}/assets/projects/{{ page.slug }}/js/{{ page.app_script }}"></script>
{% endif %}
